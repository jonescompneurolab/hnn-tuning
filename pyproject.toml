[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hnn-tuning"
version = "0.1.0"
description = "Cell models, network simulations, and analysis accompanying the HNN tuning manuscript"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Katharina Duecker", email = "katharina.duecker@gmail.com" },
]

# Runtime dependencies are listed in requirements.txt (which additionally
# pins the hnn-core development fork and NEURON). This table names only the
# packages the `hnn_tuning` helper modules import directly, so that
# `pip install -e .` pulls them if they are missing.
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
]

[tool.setuptools]
# The importable helper package lives at the repository root as hnn_tuning/.
packages = ["hnn_tuning"]
